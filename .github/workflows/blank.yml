

name: Build BoneBot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Extract mod project
        run: |
          unzip -q BoneBot-Fabric-1.21.1-GitHub-Actions.zip -d source
          BUILD_FILE="$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "Gradle build file not found in ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix keybinding
        run: |
          sed -i 's/KeyBinding\.Category\.MISC/"category.bonebot"/' "$PROJECT_DIR/src/main/java/com/bonebot/BoneBotClient.java"
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BoneBot-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
